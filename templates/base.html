<!-- base.html -->
<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>
        {% block title %}
        {% endblock %}
    </title>

    <!-- Bootstrap CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.2/dist/css/bootstrap.min.css"
        rel="stylesheet">
</head>


<body>

    <div class="container-fluid">

        <!-- 網站上方 LOGO 與標題 -->
        {% include 'header.html' %}


        <div class="row">

            <!-- 左邊側邊欄 -->
            <div class="col-sm-3 col-md-3">

                <div class="card">

                    <div class="card-header">
                        <h3>Menu</h3>
                    </div>


                    <div class="card-body">

                        <div class="list-group">

                            <a href="/" class="list-group-item">
                                HOME
                            </a>

                            <a href="/news/" class="list-group-item">
                                新聞直播
                            </a>

                            <a href="https://google.com/news"
                               class="list-group-item">
                                即時新聞
                            </a>

                            <a href="https://youtube.com/"
                               class="list-group-item">
                                YouTube
                            </a>

                            <a href="/list/" class="list-group-item">
                                商品列表
                            </a>
                            <a href="/musiclist/" class="list-group-item">
                                音樂分類
                            </a>

                            <a href="/about/" class="list-group-item">
                                關於我
                            </a>

                        </div>


                        <br>


                        <!-- Flag Counter -->
                        <a href="https://info.flagcounter.com/bdWx">
                            <img
                                src="https://s01.flagcounter.com/count2/bdWx/bg_FFFFFF/txt_000000/border_CCCCCC/columns_2/maxflags_10/viewers_0/labels_0/pageviews_0/flags_0/percent_0/"
                                alt="Flag Counter"
                                border="0">
                        </a>

                    </div>

                </div>

            </div>



            <!-- 右邊主要內容 -->
            <div class="col-sm-9 col-md-9">

                <div class="card">

                    <!-- 標題區 -->
                    <div class="card-header">

                        {% block headmessage %}
                        {% endblock %}

                    </div>


                    <!-- 文章內容 -->
                    <div class="card-body">

                        {% block content %}
                        {% endblock %}

                    </div>


                    <!-- 頁尾 -->
                    <div class="card-footer">

                        {% include 'footer.html' %}

                    </div>

                </div>

            </div>

        </div>

    </div>


    <!-- Bootstrap JavaScript -->
    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.2/dist/js/bootstrap.bundle.min.js">
    </script>

</body>

</html>

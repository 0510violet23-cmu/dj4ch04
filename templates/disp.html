{% extends 'base.html' %}

{% block title %}
{{ p.name }}
{% endblock %}

{% block headmessage %}
<h3>{{ p.name }}</h3>
{% endblock %}

{% block content %}

<table class="table table-bordered">
    <tr>
        <th>品項編號</th>
        <td>{{ p.sku }}</td>
    </tr>

    <tr>
        <th>品項名稱</th>
        <td>{{ p.name }}</td>
    </tr>

    <tr>
        <th>售價</th>
        <td>{{ p.price }}</td>
    </tr>

    <tr>
        <th>庫存數量</th>
        <td>{{ p.qty }}</td>
    </tr>
</table>

<a href="/list/">回列表</a>

{% endblock %}
